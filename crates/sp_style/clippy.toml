# renderer-side crate: no filesystem, network or process access (agents/core.md).
# all i/o goes through ipc to the browser or network process.
# clippy reads the clippy.toml next to the crate's Cargo.toml, so this only
# applies to the crates that carry a copy of it. the root clippy.toml is empty
# so no config from outside the repo applies to the other crates.
# disallowed-types only sees types written out, not inferred ones, so the std
# functions that open or create these from a path, address or program name are
# listed in disallowed-methods too.
# so are the methods that point an existing socket at a path or address and the
# ones that run an existing Command, in case one arrives without going through
# a banned constructor.
# std::os::unix and std::os::windows only exist on their own targets, so those
# entries carry allow-invalid to keep the config valid on the other one.

disallowed-methods = [
    { path = "std::fs::canonicalize", reason = "renderer crates do no filesystem i/o" },
    { path = "std::fs::copy", reason = "renderer crates do no filesystem i/o" },
